[project]
name = "zoom-mullet-begone"
version = "0.1.0"
description = "Real-time skeleton-tracked virtual pants for video calls"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # mediapipe already depends on opencv-contrib-python; do not add opencv-python
    # as well, the two packages overwrite each other's cv2 module.
    "mediapipe>=1.1",
    "numpy>=2.0",
    "onnxruntime>=1.18",  # RTMPose fallback; rtmlib itself is not used (it pulls in opencv-python)
    "platformdirs>=4.0",
    "pystray>=0.19",  # menu bar icon for --background
    "pyvirtualcam>=0.15",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[project.scripts]
zoom-mullet-begone = "zoom_mullet_begone.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zoom_mullet_begone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
